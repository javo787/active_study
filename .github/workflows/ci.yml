name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Types, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /edu
          # Placeholders: the static export only needs the variables to exist, nothing talks to Firebase while building.
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '1'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1'

  rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Run rules tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:rules 2>&1 | tee rules-test.log
      - name: Show the failures in the annotations
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path('rules-test.log').read_text(errors='replace')
          text = re.sub(r'\x1b\[[0-9;]*m', '', text)
          lines = text.splitlines()
          keep = []
          for i, line in enumerate(lines):
              if re.search(r'^\s*FAIL ', line):
                  keep.extend(lines[i:i + 14])
              elif re.search(r'Test Files|Tests |emulators: Starting|downloading|Error: Script', line):
                  keep.append(line)
          excerpt = '\n'.join(keep[-60:]) or '\n'.join(lines[-40:])
          excerpt = excerpt.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          print('::error title=Rules test failures::' + excerpt)
          PY
